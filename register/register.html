<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link con cdn de boostrap y css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style-regis.css">

    <title>Huerto Hogar</title>
</head>
<body>
    
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">

                <!-- Nombre de la pagina en el Header -->
                <img src="../img/logo.png" alt="Logo" height="74" class="d-inline-block align-text-top" href="#">
                <a class="navbar-brand" href="../inicio/home.html">Huerto Hogar</a>

                <!-- Boton de home encima del nombre de usuario -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="btn-home nav-link" aria-current="page" href="../inicio/home.html">Home</a>
                        <a class="btn-catalogo nav-link" href="../catalogo/catalogo.html">Catalogo</a>
                        <a class="btn-carrito nav-link active" href="../carrito/carrito.html">Carrito</a>
                        <a class="btn-login nav-link" href="../login/login.html">Login</a>
                        <a class="btn-reg nav-link" href="../register/register.html">Registrate</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <body>
        <h2 class="txtRegis mt-5 mb-3">Registrate</h2>

        <!-- Seccion de Register -->

        <section class="sctRegis" >
            <form class="">
                <div class="mb-3">
                    <label for="input-name" class="form-label">Nombres</label>
                    <input type="text" class="form-control" id="input-name">
    
                    <label for="input-lastname" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="input-lastname">
                </div>
                <div class="mb-3">
                    <label for="input-email" class="form-label">Correo</label>
                    <!-- input email -->
                    <input type="email" class="form-control" id="input-email" aria-describedby="emailHelp" placeholder="ejemplo@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="input-pass" class="form-label">Contraseña</label>
                    <!-- input contraseña -->
                    <input type="password" class="form-control" id="input-pass">
                </div>
                   <div class="mb-3">
                    <label for="input-pass2" class="form-label">Vuelva a escribir la contraseña</label>
                    <!-- input contraseña -->
                    <input type="password" class="form-control" id="input-pass2">
                </div>

                <!-- btn de register -->
                <a href="#" class="botonRegis btn mb-3" role="button" data-bs-toggle="button">Registrate</a>
                <!-- btn de ir a login -->
                <a class="btn-reg nav-link text-center btnLogin" href="../login/login.html">Si ya tienes cuenta, logeate!</a>
            </form>
            </form>

        </section>


    </body>
    


    <!-- Link con cdn de boostrap y js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
